<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e2e1dc;
    --text: #1a1917;
    --muted: #8a8880;
    --accent: #2d6a4f;
    --accent-light: #d8f3dc;
    --danger: #c0392b;
    --tag-work: #dbeafe;
    --tag-work-text: #1e40af;
    --tag-personal: #fce7f3;
    --tag-personal-text: #9d174d;
    --tag-general: #fef3c7;
    --tag-general-text: #92400e;
    --tag-urgent: #fee2e2;
    --tag-urgent-text: #991b1b;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container { max-width: 680px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  header .count {
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .add-form .row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .add-form input[type="text"] {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .add-form input[type="text"]:focus { border-color: var(--accent); }

  .add-form select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--bg);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }

  .btn {
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.1rem;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-ghost { background: transparent; color: var(--muted); padding: 0.5rem; }
  .btn-ghost:hover { color: var(--danger); }

  .filters {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.35rem 0.9rem;
    font-family: inherit;
    font-size: 0.82rem;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }

  .todo-list { display: flex; flex-direction: column; gap: 0.5rem; }

  .todo-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    transition: opacity 0.2s;
  }

  .todo-item.completed { opacity: 0.55; }

  .todo-item input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    margin-top: 2px;
    position: relative;
    transition: all 0.15s;
  }

  .todo-item input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .todo-item input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 1px;
    width: 8px;
    height: 5px;
    border: 2px solid #fff;
    border-top: none;
    border-right: none;
    transform: rotate(-45deg);
  }

  .todo-body { flex: 1; min-width: 0; }

  .todo-title {
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.4;
    word-break: break-word;
  }

  .todo-item.completed .todo-title {
    text-decoration: line-through;
    color: var(--muted);
  }

  .todo-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.3rem;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.15rem 0.55rem;
    border-radius: 20px;
  }

  .tag-General  { background: var(--tag-general);  color: var(--tag-general-text); }
  .tag-Work     { background: var(--tag-work);      color: var(--tag-work-text); }
  .tag-Personal { background: var(--tag-personal);  color: var(--tag-personal-text); }
  .tag-Urgent   { background: var(--tag-urgent);    color: var(--tag-urgent-text); }

  .todo-date {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .empty {
    text-align: center;
    padding: 3rem 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .empty span { display: block; font-size: 2rem; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Tasks</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="add-form">
    <div class="row">
      <input type="text" id="newTitle" placeholder="What needs to be done?" autocomplete="off">
      <select id="newCategory">
        <option value="General">General</option>
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Urgent">Urgent</option>
      </select>
      <button class="btn btn-primary" onclick="addTodo()">Add</button>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-status="all" onclick="setFilter(this,'all')">All</button>
    <button class="filter-btn" data-status="active" onclick="setFilter(this,'active')">Active</button>
    <button class="filter-btn" data-status="completed" onclick="setFilter(this,'completed')">Done</button>
    <button class="filter-btn" data-cat="" onclick="setCat(this,'')">Any category</button>
    <button class="filter-btn" data-cat="Work" onclick="setCat(this,'Work')">Work</button>
    <button class="filter-btn" data-cat="Personal" onclick="setCat(this,'Personal')">Personal</button>
    <button class="filter-btn" data-cat="Urgent" onclick="setCat(this,'Urgent')">Urgent</button>
  </div>

  <div class="todo-list" id="todoList"></div>
</div>

<script>
  let currentStatus = 'all';
  let currentCat = '';

  async function fetchTodos() {
    const params = new URLSearchParams();
    if (currentStatus !== 'all') params.set('status', currentStatus);
    if (currentCat) params.set('category', currentCat);
    const res = await fetch('/api/todos?' + params);
    const todos = await res.json();
    renderTodos(todos);
  }

  function renderTodos(todos) {
    const list = document.getElementById('todoList');
    const count = document.getElementById('count');
    const active = todos.filter(t => !t.completed).length;
    count.textContent = active + ' remaining';

    if (!todos.length) {
      list.innerHTML = '<div class="empty"><span>\u2713</span>Nothing here yet</div>';
      return;
    }

    list.innerHTML = todos.map(t => `
      <div class="todo-item ${t.completed ? 'completed' : ''}" id="item-${t.id}">
        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo(${t.id}, this.checked)">
        <div class="todo-body">
          <div class="todo-title">${escHtml(t.title)}</div>
          <div class="todo-meta">
            <span class="tag tag-${t.category}">${t.category}</span>
            <span class="todo-date">${t.created_at}</span>
          </div>
        </div>
        <button class="btn btn-ghost" onclick="deleteTodo(${t.id})" title="Delete">&#10005;</button>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function addTodo() {
    const title = document.getElementById('newTitle').value.trim();
    const category = document.getElementById('newCategory').value;
    if (!title) return;
    await fetch('/api/todos', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({title, category})
    });
    document.getElementById('newTitle').value = '';
    fetchTodos();
  }

  async function toggleTodo(id, completed) {
    await fetch(`/api/todos/${id}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({completed})
    });
    fetchTodos();
  }

  async function deleteTodo(id) {
    await fetch(`/api/todos/${id}`, {method: 'DELETE'});
    fetchTodos();
  }

  function setFilter(el, status) {
    currentStatus = status;
    document.querySelectorAll('.filter-btn[data-status]').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    fetchTodos();
  }

  function setCat(el, cat) {
    currentCat = cat;
    document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    fetchTodos();
  }

  document.getElementById('newTitle').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  fetchTodos();
</script>
</body>
</html>
